{% extends "base.html" %}
{% block contenu %}
<section class="erreur">
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-md-5">
        <div class="erreur-arche" aria-hidden="true">
          <span class="erreur-emoji">{% block emoji %}{% endblock %}</span>
          <span class="erreur-code">{% block code %}{% endblock %}</span>
        </div>
      </div>
      <div class="col-md-7">
        <h1 class="erreur-titre">{% block h1 %}{% endblock %}</h1>
        <p class="lead text-muted" style="max-width:48ch">{% block message %}{% endblock %}</p>
        <div class="d-flex flex-wrap gap-2 mt-4">
          {% block actions %}
            <a class="btn btn-fs" href="{% url 'accueil' %}">Retour à l'accueil</a>
            <a class="btn btn-fs-ligne" href="{% url 'prestataires' %}">Trouver un prestataire</a>
          {% endblock %}
        </div>
        {% block extra %}{% endblock %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
